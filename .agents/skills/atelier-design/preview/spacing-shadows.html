<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Shadows</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row3 { display: flex; gap: 28px; margin-top: 22px; padding: 16px 0; }
  .item { text-align: center; flex: 1; }
  .box { height: 96px; background: #FCFBF7; border: 1px solid var(--border); margin-bottom: 14px; }
  .nm { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
  .va { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 2px; }
</style>
</head>
<body>
<div class="card">
  <div class="label">shadows — used sparingly</div>
  <div class="row3">
    <div class="item">
      <div class="box" style="box-shadow: none;"></div>
      <div class="nm">none (default)</div>
      <div class="va">flat at rest</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: 0 1px 2px rgb(14 14 12 / 0.04);"></div>
      <div class="nm">--shadow-1</div>
      <div class="va">card hover lift</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: 0 12px 32px -8px rgb(14 14 12 / 0.12); border-color: transparent;"></div>
      <div class="nm">--shadow-2</div>
      <div class="va">modal · lightbox</div>
    </div>
  </div>
</div>
</body>
</html>
