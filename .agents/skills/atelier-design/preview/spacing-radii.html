<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row3 { display: flex; gap: 24px; margin-top: 18px; align-items: flex-end; }
  .item { text-align: center; }
  .box { width: 88px; height: 88px; background: #0E0E0C; }
  .nm { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); margin-top: 8px; }
  .va { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style>
</head>
<body>
<div class="card">
  <div class="label">radii — square by default</div>
  <div class="row3">
    <div class="item"><div class="box" style="border-radius: 0;"></div><div class="nm">--r-0</div><div class="va">0px · default</div></div>
    <div class="item"><div class="box" style="border-radius: 4px;"></div><div class="nm">--r-1</div><div class="va">4px · inputs</div></div>
    <div class="item"><div class="box" style="border-radius: 12px;"></div><div class="nm">--r-2</div><div class="va">12px · cards</div></div>
    <div class="item"><div class="box" style="border-radius: 999px; height: 40px; width: 120px;"></div><div class="nm">--r-pill</div><div class="va">999px · tags</div></div>
  </div>
</div>
</body>
</html>
