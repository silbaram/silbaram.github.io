<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row2 { display: flex; align-items: center; gap: 16px; padding: 6px 0; }
  .tok { font-family: var(--font-mono); font-size: 11px; width: 60px; color: var(--fg-3); }
  .px { font-family: var(--font-mono); font-size: 11px; width: 50px; color: var(--fg-2); }
  .bar { height: 10px; background: #0E0E0C; }
</style>
</head>
<body>
<div class="card">
  <div class="label">spacing — 4px base</div>
  <div style="margin-top: 14px;">
    <div class="row2"><div class="tok">--s-1</div><div class="px">4</div><div class="bar" style="width: 4px;"></div></div>
    <div class="row2"><div class="tok">--s-2</div><div class="px">8</div><div class="bar" style="width: 8px;"></div></div>
    <div class="row2"><div class="tok">--s-3</div><div class="px">12</div><div class="bar" style="width: 12px;"></div></div>
    <div class="row2"><div class="tok">--s-4</div><div class="px">16</div><div class="bar" style="width: 16px;"></div></div>
    <div class="row2"><div class="tok">--s-5</div><div class="px">24</div><div class="bar" style="width: 24px;"></div></div>
    <div class="row2"><div class="tok">--s-6</div><div class="px">32</div><div class="bar" style="width: 32px;"></div></div>
    <div class="row2"><div class="tok">--s-7</div><div class="px">48</div><div class="bar" style="width: 48px;"></div></div>
    <div class="row2"><div class="tok">--s-8</div><div class="px">64</div><div class="bar" style="width: 64px;"></div></div>
    <div class="row2"><div class="tok">--s-9</div><div class="px">96</div><div class="bar" style="width: 96px;"></div></div>
    <div class="row2"><div class="tok">--s-10</div><div class="px">128</div><div class="bar" style="width: 128px;"></div></div>
  </div>
</div>
</body>
</html>
