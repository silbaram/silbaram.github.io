<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Motion tokens</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row3 { display: flex; gap: 16px; margin-top: 16px; }
  .cell { flex: 1; border: 1px solid var(--border); padding: 12px; }
  .nm { font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); font-weight: 700; }
  .va { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 4px; line-height: 1.5; }
  .track { margin-top: 12px; height: 28px; position: relative; background: var(--bg-1); border-bottom: 1px solid var(--border); }
  .dot { position: absolute; top: 50%; transform: translate(0, -50%); width: 14px; height: 14px; background: #FF5B2E; border-radius: 50%; left: 0; }
  .o .dot { animation: aOut 2.4s infinite; }
  .io .dot { animation: aIO 2.4s infinite; }
  .sp .dot { animation: aSp 2.4s infinite; }
  @keyframes aOut { 0%{left:0} 50%{left:calc(100% - 14px)} 100%{left:0} }
  @keyframes aIO { 0%{left:0} 50%{left:calc(100% - 14px)} 100%{left:0} }
  @keyframes aSp { 0%{left:0} 50%{left:calc(100% - 14px)} 100%{left:0} }
  .o .dot { animation-timing-function: cubic-bezier(0.2, 0.7, 0.1, 1); }
  .io .dot { animation-timing-function: cubic-bezier(0.7, 0, 0.3, 1); }
  .sp .dot { animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
</style>
</head>
<body>
<div class="card">
  <div class="label">motion — easing curves</div>
  <div class="row3">
    <div class="cell o">
      <div class="nm">--ease-out</div>
      <div class="va">default · entrances<br>(0.2, 0.7, 0.1, 1)</div>
      <div class="track"><div class="dot"></div></div>
    </div>
    <div class="cell io">
      <div class="nm">--ease-in-out</div>
      <div class="va">state crossfades<br>(0.7, 0, 0.3, 1)</div>
      <div class="track"><div class="dot"></div></div>
    </div>
    <div class="cell sp">
      <div class="nm">--ease-spring</div>
      <div class="va">playful pops<br>(0.34, 1.56, 0.64, 1)</div>
      <div class="track"><div class="dot"></div></div>
    </div>
  </div>
  <div class="label" style="margin-top: 12px; text-transform: none; color: var(--fg-3);">
    durations — 120ms fast · 280ms base · 600ms slow
  </div>
</div>
</body>
</html>
