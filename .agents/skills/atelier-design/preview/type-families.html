<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Type families</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">
  <div class="label">families</div>
  <div style="margin-top: 18px; display: grid; grid-template-columns: 90px 1fr; gap: 14px 20px; align-items: baseline;">
    <div class="label" style="text-transform: none;">sans</div>
    <div>
      <div style="font-size: 28px; font-weight: 300; letter-spacing: -0.01em;">NanumSquareNeo — 한글 영문 1234</div>
      <div class="label" style="text-transform: none; color: var(--fg-3); margin-top: 4px;">100 · 300 · 400 · 700 · 900 (variable)</div>
    </div>
    <div class="label" style="text-transform: none;">mono</div>
    <div>
      <div style="font-family: var(--font-mono); font-size: 22px; font-weight: 500;">JetBrains Mono — abc 0123 → ↗ ×</div>
      <div class="label" style="text-transform: none; color: var(--fg-3); margin-top: 4px;">400 · 500 · 700 · used for indexes &amp; timestamps</div>
    </div>
  </div>
</div>
</body>
</html>
